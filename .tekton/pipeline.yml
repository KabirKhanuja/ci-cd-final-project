apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ci-cd-pipeline
spec:
  description: Clean, clone, lint, test, build and deploy the Hit Counter Service.
  params:
    - name: repo-url
      type: string
      default: https://github.com/KabirKhanuja/ci-cd-final-project.git
    - name: branch
      type: string
      default: main
    - name: app-name
      type: string
      default: cicd-app
  workspaces:
    - name: pipeline-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: git-clone
      runAfter:
        - cleanup
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskSpec:
        params:
          - name: url
          - name: revision
        workspaces:
          - name: source
        steps:
          - name: git-clone
            image: alpine/git:2.45.2
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -eu
              export HOME=/tmp
              git config --global --add safe.directory '*'
              git clone --depth 1 --branch "$(params.revision)" "$(params.url)" .
              git log -1 --oneline

    - name: flake8
      runAfter:
        - git-clone
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: flake8
            image: python:3.9-slim
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/bash
              set -e
              export HOME=/tmp
              python -m venv /tmp/venv
              source /tmp/venv/bin/activate
              python -m pip install --upgrade pip wheel
              pip install -q flake8==4.0.1
              flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics
              flake8 service --count --max-complexity=10 --max-line-length=127 --statistics

    - name: nose
      runAfter:
        - git-clone
      taskRef:
        name: nose
      params:
        - name: args
          value: "-v --with-spec --spec-color"
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: buildah
      runAfter:
        - flake8
        - nose
      params:
        - name: app-name
          value: $(params.app-name)
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskSpec:
        params:
          - name: app-name
        workspaces:
          - name: source
        steps:
          - name: oc-build
            image: quay.io/openshift/origin-cli:4.15
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/bash
              set -e
              export HOME=/tmp
              APP="$(params.app-name)"
              if ! oc get bc "$APP" >/dev/null 2>&1; then
                oc new-build --name "$APP" --binary --strategy docker
              fi
              oc start-build "$APP" --from-dir=. --follow --wait

    - name: deploy
      runAfter:
        - buildah
      params:
        - name: app-name
          value: $(params.app-name)
      taskSpec:
        params:
          - name: app-name
        steps:
          - name: oc-deploy
            image: quay.io/openshift/origin-cli:4.15
            script: |
              #!/bin/bash
              set -e
              export HOME=/tmp
              APP="$(params.app-name)"
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              IMAGE="image-registry.openshift-image-registry.svc:5000/${NS}/${APP}:latest"
              oc create deployment "$APP" --image="$IMAGE" --port=8000 --dry-run=client -o yaml | oc apply -f -
              oc set image deployment/"$APP" "*=$IMAGE"
              oc rollout restart deployment/"$APP"
              oc rollout status deployment/"$APP" --timeout=180s
              oc get pods -l app="$APP"
